# PostgreSQL (auth_db + file_sharing_db) + NATS + app + API gateway + optional nginx.
# After Postgres is up, run migrations (both URLs required):
#   pnpm run migration:run
#
# HTTP entrypoints:
#   - http://localhost/        → nginx → /api/* and /api-docs (see docker/nginx/nginx.conf)
#   - http://localhost:4000/   → api-gateway directly (debugging; omit ports on api-gateway to force nginx only)

services:
  nats:
    image: nats:2
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    command: ["-m", "8222"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fileshare
      POSTGRES_PASSWORD: fileshare
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileshare -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-supersecret}
      NATS_URL: nats://nats:4222
    ports:
      - "4000:4000"
    depends_on:
      nats:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - app

  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    environment:
      DATABASE_URL_AUTH: postgresql://fileshare:fileshare@postgres:5432/auth_db
      DATABASE_URL_FILE_SHARING: postgresql://fileshare:fileshare@postgres:5432/file_sharing_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-supersecret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecret}
      NATS_URL: nats://nats:4222
      FILE_S3_REGION: ${FILE_S3_REGION:-us-east-1}
      FILE_S3_BUCKET: ${FILE_S3_BUCKET:-}
      FILE_S3_ACCESS_KEY: ${FILE_S3_ACCESS_KEY:-}
      FILE_S3_SECRET_KEY: ${FILE_S3_SECRET_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "until nc -z nats 4222; do sleep 1; done"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app

volumes:
  pg_data:

networks:
  app:
    driver: bridge
