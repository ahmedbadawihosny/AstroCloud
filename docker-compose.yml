services:
  nats:
    image: nats:2
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    command: ["-m", "8222"]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # الوحيد المعرّض (port 3000) – كل السيرفسز تتكلم الـ api-gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 3000
      GATEWAY_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      NATS_URL: nats://nats:4222
      AUTH_SVC_URL: http://auth-service:3001
      FILE_SVC_URL: http://file-service:3002
    ports:
      - "3000:3000"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - app

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      MONGODB_URI: mongodb://root:rootpass@mongo:27017/auth_db?authSource=admin
      NATS_URL: nats://nats:4222
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://root:rootpass@mongo:27017/file_db?authSource=admin
      NATS_URL: nats://nats:4222
      FILE_S3_ENDPOINT: http://minio:9000
      FILE_S3_REGION: us-east-1
      FILE_S3_BUCKET: files
      FILE_S3_ACCESS_KEY: minio
      FILE_S3_SECRET_KEY: minio12345
      FILE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/notifications/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app

volumes:
  mongo_data:
  minio_data:

networks:
  app:
    driver: bridge
